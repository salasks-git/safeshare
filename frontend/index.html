<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Safe-Drop — Instant Secure File Transfer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Connect two devices with a 6-digit code and share files instantly. No login, no install. Files vanish when you're done.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#005c55",
            "primary-container": "#0f766e",
            "on-surface": "#131b2e",
            "on-surface-variant": "#3e4947",
            "surface": "#faf8ff",
            "surface-container": "#eaedff",
            "surface-container-low": "#f2f3ff",
            "surface-container-lowest": "#ffffff",
            "outline-variant": "#bdc9c6",
            "secondary-container": "#a8ece5",
            "on-secondary-container": "#266d68",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
          },
          spacing: {
            "margin": "2rem", "margin-mobile": "1rem",
            "space-xs": "0.25rem", "space-sm": "0.5rem",
            "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2.5rem",
          },
        },
      },
    };
  </script>
  <style>
    @layer base {
      html, body { width: 100vw; min-height: 100%; margin: 0; padding: 0; }
      body { overscroll-behavior: none; font-family: 'Inter', sans-serif; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    .digit-input { width: 3rem; height: 3.5rem; text-align: center; font-size: 1.25rem; font-weight: 700;
      border-radius: 0.75rem; border: 1.5px solid #bdc9c6; background: #F2F4F9; color: #141722;
      transition: border-color 0.15s, box-shadow 0.15s; outline: none; }
    .digit-input:focus { border-color: #141722; box-shadow: 0 0 0 3px rgba(20,23,34,0.12); }
    .btn-primary { min-height: 48px; background: #141722; color: #fff; border-radius: 9999px;
      font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; cursor: pointer; transition: opacity 0.15s, transform 0.1s; width: 100%; border: none; }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: #ba1a1a; font-size: 0.875rem; margin-top: 0.5rem; min-height: 1.25rem; }
    .toast { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%);
      background: #141722; color: #fff; padding: 0.6rem 1.2rem; border-radius: 9999px;
      font-size: 0.875rem; font-weight: 600; z-index: 100;
      animation: toast-in 0.2s ease; pointer-events: none; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen selection:bg-secondary-container selection:text-on-secondary-container">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
