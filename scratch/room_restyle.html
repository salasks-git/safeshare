<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Safe-Drop • Ephemeral Transfer Room</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Space Grotesk & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<!-- Custom Tailwind Config matching Reference 1 style palette -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              lime: '#B9FF66',
              dark: '#191A23',
              gray: '#F3F3F3',
              card: '#FFFFFF',
              border: '#191A23',
              muted: '#71717A'
            }
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          boxShadow: {
            'brutal': '0px 5px 0px 0px #191A23',
            'brutal-sm': '0px 3px 0px 0px #191A23',
            'brutal-hover': '0px 2px 0px 0px #191A23',
            'dock': '0 20px 40px -15px rgba(25, 26, 35, 0.15)'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFFFFF;
      color: #191A23;
    }
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
    /* Subtle dot grid pattern similar to technical brutalist aesthetics */
    .bg-grid {
      background-image: radial-gradient(#191A23 0.75px, transparent 0.75px);
      background-size: 24px 24px;
    }
  </style>
<style data-purpose="micro-animations">
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.75; }
    }
    .status-pulse {
      animation: pulse-dot 2s infinite ease-in-out;
    }
    @keyframes orbit-float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
    }
    .floating-illustration {
      animation: orbit-float 4s ease-in-out infinite;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#FAFAFA] text-brand-dark antialiased selection:bg-brand-lime selection:text-brand-dark">
<!-- BEGIN: Top Navigation Header -->
<header class="w-full border-b border-brand-dark/10 bg-white sticky top-0 z-40">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
<!-- Brand & Room Status -->
<div class="flex items-center space-x-4">
<!-- Logo Icon Pill -->
<div class="w-11 h-11 bg-brand-dark rounded-xl flex items-center justify-center text-white border-2 border-brand-dark shadow-brutal-sm transition-transform hover:-translate-y-0.5">
<svg class="w-5 h-5 text-brand-lime" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
</svg>
</div>
<div>
<div class="flex items-center space-x-2">
<h1 class="font-display font-bold text-xl tracking-tight leading-none text-brand-dark">Safe-Drop</h1>
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#E9FFCC] text-brand-dark border border-brand-dark/30">
<span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 status-pulse"></span>
              Connected
            </span>
</div>
<p class="text-xs font-medium text-brand-muted mt-0.5">Ephemeral Transfer Room</p>
</div>
<!-- Room Code Pill -->
<div class="hidden md:flex items-center bg-brand-gray border border-brand-dark/20 rounded-full px-3.5 py-1 text-xs font-semibold text-brand-dark space-x-1.5">
<span class="text-brand-muted font-normal">Room</span>
<span class="font-display font-bold tracking-wider text-brand-dark">843053</span>
</div>
</div>
<!-- Actions & Countdown -->
<div class="flex items-center space-x-3">
<!-- Timer Badge -->
<div class="flex items-center bg-white border-2 border-brand-dark rounded-full px-3.5 py-1.5 shadow-brutal-sm space-x-2">
<svg class="w-4 h-4 text-brand-dark stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<polyline points="12 6 12 12 16 14"></polyline>
</svg>
<span class="font-display font-bold text-sm tracking-wider text-brand-dark">59:10</span>
</div>
<!-- End Session Button -->
<button class="group flex items-center space-x-2 bg-white hover:bg-red-50 text-red-600 border-2 border-brand-dark rounded-full px-4 py-1.5 font-bold text-sm shadow-brutal-sm hover:shadow-brutal-hover active:translate-y-0.5 transition-all" type="button">
<svg class="w-4 h-4 stroke-[2.5] text-red-500 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
<line x1="12" x2="12" y1="2" y2="12"></line>
</svg>
<span class="">End session</span>
</button>
</div>
</div>
</header>
<!-- END: Top Navigation Header -->
<!-- BEGIN: Main Room Content Area -->
<main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col justify-start space-y-7">
<!-- Notice Banner (Card styled after Reference 1 with Highlight Badge) -->

<!-- Shared Files Header Bar -->
<div class="flex items-center justify-between px-1">
<div class="flex items-center space-x-3">
<!-- Title with Highlighter Marker styling from Reference 1 -->
<div class="inline-block relative">
<span class="bg-brand-lime px-3 py-1 rounded-lg border-2 border-brand-dark font-display font-bold text-xl text-brand-dark inline-block shadow-brutal-sm">
            Shared Files
          </span>
</div>
<!-- 0 Items pill -->
<span class="text-xs font-bold font-display px-2.5 py-1 bg-white border border-brand-dark/30 text-brand-dark rounded-full">
          0 items
        </span>
</div>
<!-- Live Syncing Status Indicator -->
<div class="flex items-center space-x-2 text-xs font-bold text-brand-dark">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
</span>
<span class="tracking-wide">Live syncing</span>
</div>
</div>
<!-- Empty State Illustrated Canvas -->
<section class="w-full flex-1 min-h-[380px] bg-white border-2 border-dashed border-brand-dark/30 rounded-3xl p-8 flex flex-col items-center justify-center text-center relative overflow-hidden transition-all hover:border-brand-dark/50" data-purpose="empty-state">
<!-- Graphic Line-art Illustration reminiscent of reference style -->
<div class="floating-illustration relative mb-6">
<!-- Subtle concentric decorative rings from reference 1 -->
<div class="w-32 h-20 border-2 border-brand-dark/20 rounded-full absolute -top-4 -left-6 rotate-[-12deg] pointer-events-none"></div>
<div class="w-36 h-24 border-2 border-brand-dark/15 rounded-full absolute -top-6 -left-8 rotate-[-6deg] pointer-events-none"></div>
<!-- Center Icon Box -->
<div class="relative z-10 w-24 h-24 bg-brand-gray border-2 border-brand-dark rounded-3xl flex items-center justify-center shadow-brutal group-hover:scale-105 transition-transform">
<!-- Sparkle/Diamond accent star from reference 1 -->
<div class="absolute -top-3 -right-3 w-7 h-7 bg-brand-lime border-2 border-brand-dark rounded-md flex items-center justify-center rotate-12 shadow-brutal-sm">
<svg class="w-4 h-4 text-brand-dark fill-current" viewBox="0 0 24 24">
<path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"></path>
</svg>
</div>
<!-- Upload Document Icon -->
<svg class="w-11 h-11 text-brand-dark stroke-[1.8]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
<polyline points="14 2 14 8 20 8"></polyline>
<path d="M12 18v-6"></path>
<path d="m9 15 3-3 3 3"></path>
</svg>
</div>
</div>
<!-- Typography -->
<h3 class="font-display font-bold text-2xl text-brand-dark mb-2 tracking-tight">No items yet</h3>
<p class="text-brand-muted font-medium text-sm max-w-sm">
        Send a file or text to get started.
      </p>
</section>
</main>
<!-- END: Main Room Content Area -->
<!-- BEGIN: Bottom Input Dock & Action Bar -->
<aside class="sticky bottom-6 z-30 max-w-3xl w-full mx-auto px-4 mt-4">
<div class="bg-white border-2 border-brand-dark rounded-full p-2 pl-4 sm:pl-5 shadow-brutal flex items-center justify-between gap-3 backdrop-blur-md">
<!-- Text / Code Input Container -->
<div class="flex-1 flex items-center space-x-2">
<input class="w-full bg-transparent border-0 focus:ring-0 text-brand-dark placeholder-brand-muted text-sm sm:text-base font-mono outline-none py-1.5 px-0" placeholder="Paste code or text..." type="text">
<!-- Send Button -->
<button aria-label="Send text" class="w-10 h-10 rounded-full bg-brand-gray border-2 border-brand-dark flex items-center justify-center text-brand-dark hover:bg-brand-lime transition-colors shrink-0 shadow-brutal-sm" type="button">
<svg class="w-4 h-4 -rotate-45 ml-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<line x1="22" x2="11" y1="2" y2="13"></line>
<polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
</svg>
</button>
</div>
<!-- Vertical Divider -->
<div class="h-8 w-[2px] bg-brand-dark/15 hidden sm:block"></div>
<!-- File Upload Action Button (Reference 1 high-contrast dark button style) -->
<button class="bg-brand-dark hover:bg-brand-dark/90 text-white rounded-full px-6 py-2.5 flex items-center space-x-2 font-display font-bold text-sm tracking-wide border-2 border-brand-dark shadow-brutal-sm active:translate-y-0.5 transition-all shrink-0 group" type="button">
<svg class="w-4 h-4 text-brand-lime group-hover:scale-110 transition-transform stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
<polyline points="14 2 14 8 20 8"></polyline>
<line x1="12" x2="12" y1="18" y2="12"></line>
<line x1="9" x2="15" y1="15" y2="15"></line>
</svg>
<span class="">File</span>
</button>
</div>
</aside>
<!-- END: Bottom Input Dock & Action Bar -->
<!-- BEGIN: Footer -->
<footer class="w-full border-t border-brand-dark/10 py-5 bg-white text-xs text-brand-muted mt-auto">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
<!-- Security Credential Statement -->
<div class="flex items-center space-x-2 font-medium">
<svg class="w-3.5 h-3.5 text-brand-dark stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
</svg>
<span class="">Zero permanent storage • Peer-to-peer ephemeral handoff</span>
</div>
<!-- Compliance Link -->
<div class="font-medium">
<a class="hover:text-brand-dark underline underline-offset-4 decoration-brand-dark/30 hover:decoration-brand-dark transition-colors" href="#">
          Privacy &amp; Report abuse
        </a>
</div>
</div>
</footer>
<!-- END: Footer -->


</body></html>
