<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Safe-Drop — Instant Secure File Transfer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Connect two devices with a 6-digit code and share files instantly. No login, no install. Files vanish when you're done.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              lime: '#B9FF66',
              limeHover: '#a3f04b',
              dark: '#191A23',
              darker: '#0F1015',
              gray: '#F3F3F3',
              cardBg: '#FFFFFF',
              muted: '#71717A',
              border: '#191A23'
            }
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          boxShadow: {
            'brutal': '0px 5px 0px 0px #191A23',
            'brutal-sm': '0px 3px 0px 0px #191A23',
            'brutal-hover': '0px 2px 0px 0px #191A23',
            'brutal-active': '0px 1px 0px 0px #191A23',
            'dock': '0 20px 40px -15px rgba(25, 26, 35, 0.15)'
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body { width: 100vw; min-height: 100%; margin: 0; padding: 0; }
      body {
        overscroll-behavior: none;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #F3F3F3;
        color: #191A23;
        -webkit-font-smoothing: antialiased;
      }
      .font-display { font-family: 'Space Grotesk', sans-serif; }
      .bg-grid { background-image: radial-gradient(#191A23 0.75px, transparent 0.75px); background-size: 24px 24px; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    
    .otp-input:focus {
      outline: none;
      border-color: #191A23;
      box-shadow: 0 0 0 3px #B9FF66;
    }
    .action-btn { transition: all 0.15s ease-in-out; }
    .action-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0px 6px 0px 0px #191A23; }
    .action-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0px 1px 0px 0px #191A23; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    @keyframes pulse-dot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.75; } }
    .status-pulse { animation: pulse-dot 2s infinite ease-in-out; }
    @keyframes orbit-float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(1.5deg); } }
    .floating-illustration { animation: orbit-float 4s ease-in-out infinite; }
  </style>
</head>
<body class="antialiased selection:bg-brand-lime selection:text-brand-dark">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
